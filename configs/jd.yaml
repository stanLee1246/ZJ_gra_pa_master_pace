# Configure a verified JData version and complete time coverage before use.
project:
  seed: 20261022
data:
  platform: jd
  kind: public
  version: JData-version-validation-required
  input_glob: data/raw/jd/JData_Action_*.csv
  encoding: utf-8
  business_timezone: Asia/Shanghai
  source_timezone: Asia/Shanghai
  coverage_start: null
  coverage_end: null
output_root: artifacts
task:
  lookback_hours: 48
  horizon_hours: 24
  session_gap_minutes: 30
  train_dates: []
  validation_dates: []
  test_dates: []
mining:
  min_support: 0.02
  max_pattern_length: 4
  feature_patterns: 10
  clusters: 4
model:
  gbt_iterations: 50
  gbt_depth: 5
  lr_iterations: 60
spark:
  master: local[4]
  driver_memory: 6g
  shuffle_partitions: 64
